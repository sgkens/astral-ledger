name = "astral-ledger-api"
main = "apps/api/src/index.ts"
compatibility_date = "2026-04-09"

[vars]
APP_NAME = "Astral Ledger"
ADMIN_REQUIRE_ACCESS_HEADER = "true"
ADMIN_API_KEY = "replace-me-dev-key"

[[d1_databases]]
binding = "DB"
database_name = "astral-ledger"
database_id = "replace-me"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "astral-ledger-media"
